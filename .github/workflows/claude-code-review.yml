name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # The action throws for any actor that is not a User account, so
    # events from bots are skipped here. A pull request Claude has
    # already reviewed is not reviewed again, so pushes after its first
    # review are not reviewed.
    if: |
      github.event.sender.type == 'User' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Runs for the same pull request queue rather than overlap, so a
    # later run sees any review an earlier one posted.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Claude posts through the Claude GitHub App's token, not this
      # job's, so the job itself only reads.
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    env:
      # Claude Code removes the credentials it knows of, among them the
      # OAuth token, the OIDC request token and the workflow token, from
      # the environment of the commands it runs. GITHUB_TOKEN, the App
      # token gh uses, is not among them.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The pull request may change the AGENTS.md files it is reviewed
      # against, so the review reads the default branch's, kept outside
      # the workspace.
      - name: Checkout the default branch's guidance
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          fetch-depth: 1
          persist-credentials: false
      - run: mv .base "$RUNNER_TEMP/base"

      # A review is Claude's comment containing the plugin's "## Code
      # review" heading, or an inline comment that does not reply to
      # another. The plugin looks only at comments, where a review of
      # inline comments alone does not show, so the check is made here.
      - name: Look for an earlier review
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]" and (.body | contains("## Code review"))) | .id' > earlier.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]" and .in_reply_to_id == null) | .id' >> earlier.txt
          if [ -s earlier.txt ]; then
            reviewed=true
          else
            reviewed=false
          fi
          echo "reviewed=$reviewed" | tee -a "$GITHUB_OUTPUT"

      # Claude Code refuses to scrub subprocess environments without
      # bubblewrap, which also runs those subprocesses in their own PID
      # namespace. Ubuntu restricts the unprivileged user namespaces it
      # needs unless told otherwise.
      - name: Install bubblewrap
        if: steps.earlier.outputs.reviewed == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude Code Review
        id: claude-review
        if: steps.earlier.outputs.reviewed == 'false'
        uses: anthropics/claude-code-action@v1
        env:
          # The plugin starts its subagents in the background and ends
          # its turn to wait for them, but the action stops at the first
          # result, abandoning them (anthropics/claude-code-action#1499).
          # Run them in the foreground instead.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The review runs unasked, so its App token can comment on the
          # pull request and do nothing else: the action's default also
          # writes contents and issues. actions: read lets gh read this
          # pull request's CI runs.
          additional_permissions: |
            contents: read
            issues: read
            actions: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the plugin prints its review to the log
          # and posts nothing.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # The action starts the inline-comment server only when this
          # names it. The plugin's own allowed-tools grants the rest.
          # The gh commands read CI results in place of a build.
          # The plugin asks for CLAUDE.md files by name; the guidance
          # here is in AGENTS.md files, read from the default branch.
          # Replies to @claude, posted by the same App, are not reviews.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            "Bash(gh pr checks:*)" "Bash(gh run view:*)"
            --add-dir "${{ runner.temp }}/base"
            --append-system-prompt "This repository keeps its guidance for
            agents in AGENTS.md files, at the root and in directories below
            it, and has no CLAUDE.md. Wherever the review asks for CLAUDE.md
            files, rules or compliance, use the AGENTS.md files instead,
            limited by directory in the same way. Read those files, and the
            files in the repository they link to, from the default branch's
            copy in ${{ runner.temp }}/base: the pull request may change
            them, and where the two disagree, review against the default
            branch's. Everything else, the pull request's code included, is
            in the working tree as usual. When checking whether Claude has
            already reviewed this pull request, count only a comment by
            Claude containing a '## Code review' heading or an inline
            comment Claude left on the diff; Claude's replies to @claude
            mentions are not reviews. To learn whether the change builds
            and passes its tests, read its CI results with gh pr checks and
            gh run view --log-failed instead of building it."
          # The whole point of this repository: the SDK output is
          # hidden by default, which is why denied tools cannot be
          # named from a normal run.
          show_full_output: true

      # A denied tool call leaves the review half-done, but the action
      # still reports success — which is how eight broken runs went
      # unnoticed in eslint-plugin-tailwindcss. Fail loudly instead.
      - name: Fail on permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          # Comma-separated tool names whose denial is the configuration
          # working rather than a fault. None yet.
          EXPECTED_DENIALS: ''
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo 'No execution file; the action did not get far enough to produce one.'
            exit 0
          fi
          jq -r --arg expected "$EXPECTED_DENIALS" '
            ($expected | split(",")) as $ok
            | [.. | objects | select(has("permission_denials")) | .permission_denials[]]
            | unique_by(.tool_use_id)
            | map(select(.tool_name as $n | $ok | index($n) | not))
            | .[] | "\(.tool_name)  \(.tool_input | tostring)"' \
            "$EXECUTION_FILE" > denials.txt
          if [ -s denials.txt ]; then
            echo 'Claude Code was denied these tool calls:'
            cat denials.txt
            exit 1
          fi
          echo 'No unexpected permission denials.'

      # The last background_tasks_changed record lists the tasks still
      # running when the session ended; any left over were abandoned.
      - name: Fail on abandoned background tasks
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo 'No execution file; the action did not get far enough to produce one.'
            exit 0
          fi
          outstanding=$(jq -s '[.. | objects
            | select(.subtype? == "background_tasks_changed")
            | .tasks | length] | last // 0' "$EXECUTION_FILE")
          if [ "$outstanding" -gt 0 ]; then
            echo "The session ended with $outstanding background task(s) still running."
            exit 1
          fi
          echo 'No background tasks left running.'

      # Zero denials and a clean exit still say nothing about whether a
      # review happened: the run that prompted this check ended green,
      # mid-flow, having posted nothing at all. A review is found as in
      # the check for an earlier one.
      - name: Fail when the review posted nothing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]" and (.body | contains("## Code review"))) | .id' > reviews.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]" and .in_reply_to_id == null) | .id' >> reviews.txt
          if [ -s reviews.txt ]; then
            echo 'Review present.'
            exit 0
          fi
          echo 'The job finished without posting a review.'
          exit 1
