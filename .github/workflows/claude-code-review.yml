name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # The action throws for any actor that is not a User account, so
    # events from bots are skipped here. A pull request is reviewed
    # once: the check for an earlier review skips later pushes.
    if: |
      github.event.sender.type == 'User' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Runs for the same pull request run one at a time, so a later run
    # sees any review an earlier one posted. GitHub keeps one waiting
    # run per group: a newer push cancels one still waiting.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Claude posts through the Claude GitHub App's token, not this
      # job's; the job itself writes only its status comment.
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    # Every step continues on error: a failure shows as an annotation
    # on the run, and the job still passes.
    steps:
      # Left in place, this job's token sits in .git/config, in the
      # workspace Claude reads.
      - name: Checkout repository
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # A review is Claude's comment containing the "## Code review"
      # heading, which the full-review skill posts whether or not it
      # found issues. An inline comment does not count: @claude can
      # post one outside a review. The plugin's own check stops at any
      # comment by Claude, so the skill sets it aside and the check is
      # made here.
      - name: Look for an earlier review
        id: earlier
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]" and (.body | contains("## Code review"))) | .id' > "$RUNNER_TEMP/earlier.txt"
          if [ -s "$RUNNER_TEMP/earlier.txt" ]; then
            reviewed=true
          else
            reviewed=false
          fi
          echo "reviewed=$reviewed" | tee -a "$GITHUB_OUTPUT"

      # The pull request may change the AGENTS.md files it is reviewed
      # against, so the review reads the default branch's, kept outside
      # the workspace, and does not run without them.
      - name: Checkout the default branch's guidance
        if: steps.earlier.outputs.reviewed == 'false'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          fetch-depth: 1
          persist-credentials: false
      - name: Move the guidance out of the workspace
        id: guidance
        if: steps.earlier.outputs.reviewed == 'false'
        continue-on-error: true
        run: mv .base "$RUNNER_TEMP/base"

      - name: Run Claude Code Review
        id: claude-review
        if: steps.guidance.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          # The plugin starts its subagents in the background and ends
          # its turn to wait for them, but the action stops at the first
          # result, abandoning them (anthropics/claude-code-action#1499).
          # Run them in the foreground instead.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The project's full-review skill, the default branch's copy as
          # the action restores .claude from it, runs the plugin with
          # this repository's rules and posts the findings.
          prompt: '/full-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The review runs unasked, so its App token reads contents,
          # issues and CI runs, and writes to pull requests to comment;
          # the action's default also writes contents and issues. gh,
          # run by Claude, uses this token.
          additional_permissions: |
            contents: read
            issues: read
            actions: read
          # Skill runs the skill and the plugin's command, whose own
          # allowed-tools grant the rest, but not the gh commands that
          # read CI results in place of a build. The action starts the
          # inline-comment server only when this names it. The appended
          # prompt says where the default branch's copy is.
          claude_args: >-
            --allowedTools "Skill"
            "mcp__github_inline_comment__create_inline_comment"
            "Bash(gh pr checks:*)" "Bash(gh run view:*)"
            --add-dir "${{ runner.temp }}/base"
            --append-system-prompt "The default branch's copy of this
            repository is in ${{ runner.temp }}/base."
          # The whole point of this repository: the SDK output is
          # hidden by default, which is why denied tools cannot be
          # named from a normal run.
          show_full_output: true

      # The model often reaches for commands it was not granted and
      # works around the refusal, so a refusal is reported, not fatal.
      - name: Report permission denials
        if: always()
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo 'No execution file; Claude did not run.'
            exit 0
          fi
          jq -r '
            [.. | objects | select(has("permission_denials")) | .permission_denials[]]
            | unique_by(.tool_use_id)
            | .[] | "::warning title=Tool call refused::\(.tool_name)  \(.tool_input | tostring)"' \
            "$EXECUTION_FILE"

      # The last background_tasks_changed record lists the tasks still
      # running when the session ended; any left over were abandoned.
      # Tasks marked ambient are Claude Code's housekeeping, not work.
      - name: Warn on abandoned background tasks
        if: always()
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo 'No execution file; Claude did not run.'
            exit 0
          fi
          outstanding=$(jq -s '[.. | objects
            | select(.subtype? == "background_tasks_changed")
            | [.tasks[]? | select(.ambient != true)] | length]
            | last // 0' "$EXECUTION_FILE")
          if [ "$outstanding" -gt 0 ]; then
            echo "::warning title=Background tasks abandoned::The session ended with $outstanding background task(s) still running."
          else
            echo 'No background tasks left running.'
          fi

      # The action reports success whether or not a review was posted.
      # Without an execution file Claude never ran: a step before it
      # failed, or the action skipped a pull request that changes this
      # workflow. A review is found by its report, as in the check for
      # an earlier one, whichever run or session posted it, so one that
      # failed before its report counts as missing. When there is none,
      # a status comment on the pull request says so, updated by later
      # runs and deleted once a review is posted.
      - name: Report a missing review
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EARLIER: ${{ steps.earlier.outcome }}
          GUIDANCE: ${{ steps.guidance.outcome }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          MARKER: '<!-- claude-review-status -->'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          comments="repos/${GITHUB_REPOSITORY}/issues/${PR}/comments"
          gh api --paginate "$comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' > "$RUNNER_TEMP/status.txt"
          read -r status < "$RUNNER_TEMP/status.txt" || status=
          gh api --paginate "$comments" \
            --jq '.[] | select(.user.login == "claude[bot]" and (.body | contains("## Code review"))) | .id' > "$RUNNER_TEMP/reviews.txt"
          if [ -s "$RUNNER_TEMP/reviews.txt" ]; then
            echo 'Review present.'
            if [ -n "$status" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${status}"
            fi
            exit 0
          fi
          if [ -f "$EXECUTION_FILE" ]; then
            message="Claude's review ran but posted no report."
          elif [ "$EARLIER" = failure ]; then
            message="Claude's review did not run: the check for an earlier review failed."
          elif [ "$GUIDANCE" = failure ]; then
            message="Claude's review did not run: the default branch's guidance could not be checked out."
          else
            message="Claude's review did not run, as on a pull request that changes the review workflow."
          fi
          echo "::warning title=No review posted::$message"
          body="${MARKER}
          ${message} [Run](${RUN_URL})"
          if [ -n "$status" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${status}" -f body="$body" > /dev/null
          else
            gh api "$comments" -f body="$body" > /dev/null
          fi
